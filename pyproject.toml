[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "c2cos"
version = "0.2.0"
description = "Dual-channel C2C agent runtime with evidence-dependent literature review"
requires-python = ">=3.10"
dependencies = [
  "torch==2.6.0",
  "transformers==4.52.4",
  "accelerate==1.7.0",
  "huggingface-hub==0.32.4",
  "lm-format-enforcer==0.11.3",
  "jsonschema==4.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
